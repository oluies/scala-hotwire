name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: sbt test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25', '26']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache Coursier / Ivy / sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ matrix.java }}-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-${{ matrix.java }}-
            ${{ runner.os }}-sbt-

      # One sbt invocation, not two. sbt 2's client starts a background server
      # and leaves it running; a second `sbt` step attaches to it as a thin
      # client and intermittently dies in <1s with no output at all. That race
      # hit JDK 25 on #33 and JDK 21 on #34 -- it follows whichever job loses,
      # not a JDK version. Keeping both commands in one process removes the
      # cross-step handoff entirely.
      #
      # testFull, not test: under sbt 2 `test` has testQuick semantics and
      # exits 0 without running anything when caches are warm.
      - name: Compile and test
        run: sbt -batch -no-colors "Test/compile; testFull"
