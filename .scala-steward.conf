# Scala Steward configuration
# Reference: https://github.com/scala-steward-org/scala-steward/blob/main/docs/repo-specific-configuration.md

pullRequests.frequency = "7 days"

updates.limit = 5

commits.message = "${artifactName}: ${currentVersion} -> ${nextVersion}"

# Bundle all updates into a single PR per run instead of one PR per artifact.
pullRequests.grouping = [
  { name = "all", title = "Dependency updates", filter = [{ group = "*" }] }
]

# No Scala pin: this project tracks the Scala Next line (3.8.x), not LTS.
# A `3.3.` pin here would silently freeze Scala updates entirely, since Steward
# would only ever consider 3.3.x candidates against a 3.8.x build.

# Twirl publishes only milestones against the sbt 2 binary (2.1.0-Mx); the
# stable 2.0.x line is sbt 1 only. Steward ignores stable -> pre-release moves
# by default, which would freeze twirl at whatever milestone we last set by
# hand. Allow pre-releases for it specifically. Stable versions are still
# offered, so a real 2.1.0 will come through this rule too.
updates.allowPreReleases = [
  { groupId = "org.playframework.twirl" }
]
